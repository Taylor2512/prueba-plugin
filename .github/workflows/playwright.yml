name: Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  static:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Lint
      run: npm run lint
    - name: Auditoría de tests
      run: npm test -- audit
    - name: Contrato fuente→test
      run: node scripts/testing/source-tests.mjs --validate

  unit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - name: Vitest (unit + integration)
      run: npm test
    - name: Tests de tooling
      run: |
        node tests/tooling/project-tools.test.mjs
        node tests/tooling/importer.test.mjs

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Playwright (chromium, firefox, webkit)
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: reports/testing/playwright/
        retention-days: 30
